[project]
name = "audit-sft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alex Frolov", email = "2204929@gmail.com" }
]
requires-python = ">=3.12,<3.13"
# Этот файл/uv.lock — CUDA-сервер (аналог requirements-unsloth-cuda.txt,
# версии сверены с ним же). mlx-lm (Apple Silicon, MLX) сюда намеренно не
# включён — он требует transformers>=5.0.0, что несовместимо с
# transformers==4.56.2 ниже (нужен под unsloth/Qwen3), а universal-резолвинг
# uv не даёт развести это через marker/extra на один и тот же пакет без
# конфликтов. Для локальной разработки на Mac (mlx-lm) — по-прежнему
# `pip install -r requirements.txt`, не uv.
dependencies = [
    "bert-score>=0.3.13",
    # datasets: диапазон, разрешённый unsloth (см. requirements-unsloth-cuda.txt) —
    # 4.4+ и 4.0.*/4.1.0 явно исключены.
    "datasets!=4.0.*,!=4.1.0,<4.4.0,>=3.4.1",
    "dotenv>=0.9.9",
    # gradio: без верхней границы резолвер тянет huggingface-hub>=1.16, а
    # transformers==4.56.2 (см. ниже, зафиксирован под unsloth/Qwen3) требует
    # huggingface-hub<1.0 — несовместимо. Даём резолверу сузиться до largest
    # gradio, совместимого с huggingface-hub<1.0, через явную границу на hub.
    "gradio",
    "huggingface-hub>=0.34.0,<1.0",
    "nvidia-ml-py>=13.610.43",
    "openai>=3.3.1",
    "peft!=0.11.0,>=0.18.0",
    "pydantic>=2.13.4",
    # torch/torchvision/torchaudio: пины из requirements-unsloth-cuda.txt —
    # unsloth core требует torch>=2.4.0,<2.11.0. Индекс — см. [tool.uv.sources]/
    # [[tool.uv.index]] ниже: без него уходят на обычный PyPI (не cu128-сборка),
    # что даёт ABI-рассинхрон с системным CUDA/NCCL при импорте torch.
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "torchao>=0.13.0",
    "triton>=3.0.0",
    # trackio: как и gradio выше, без верхней границы резолвер тянет
    # huggingface-hub>=1.10, несовместимо с transformers==4.56.2 (hub<1.0).
    "trackio",
    "trl!=0.19.0,<=0.24.0,>=0.18.2",
    "accelerate>=0.34.1",
    "bitsandbytes!=0.46.0,!=0.48.0,>=0.45.5",
    # transformers: разрешённый диапазон unsloth — >=4.51.3,<=5.5.0, минус набор
    # конкретно исключённых версий (среди них вся ветка 5.x, ломающая
    # Qwen3-fastpath через apply_qkv). 4.56.2 не входит в исключения.
    "transformers==4.56.2",
    # unsloth[cu128-ampere-torch280]: официальная сборка под A100/Ampere +
    # torch 2.8.0 + CUDA 12.8 — сама подтягивает верную версию xformers/
    # bitsandbytes для этой комбинации.
    "unsloth[cu128-ampere-torch280]==2026.7.4",
    "unsloth-zoo==2026.7.4",
]

[tool.uv]
# package = false: этот проект — набор скриптов (python lora_peft/app.py,
# lora_peft/finetune.py, ...), не импортируемый пакет audit_sft (которого
# физически нет — src/audit_sft/__init__.py никогда не существовал, это
# просто дефолтный boilerplate от `uv init`). Без этого uv_build пытается
# собрать и установить сам проект как пакет и падает: "Expected a Python
# module at: src/audit_sft/__init__.py". package = false просто ставит
# зависимости в .venv, ничего не билдит и не устанавливает из самого репо.
package = false

# Этот lock только под CUDA-сервер (Linux) — см. комментарий у dependencies
# про mlx-lm. Без этого резолвер всё равно пытается свести граф под macOS
# (через darwin-only транзитивную ветку unsloth-zoo -> mlx-vlm ->
# transformers>=5.x) и падает, хотя реально используемое здесь окружение —
# только Linux.
environments = [
    "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
